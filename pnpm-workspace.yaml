nodeLinker: hoisted

packages:
  - 'apps/*'
  - 'packages/*'

strictDepBuilds: true

allowBuilds:
  'msgpackr-extract@3.0.4': false
  argon2: true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  prisma: true

minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.102.8'
  - '@tanstack/react-query@5.102.8'
