name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same major as the embedded dev database (PostgreSQL 18).
        image: postgres:18
        env:
          POSTGRES_USER: agri
          POSTGRES_PASSWORD: agri
          POSTGRES_DB: agrimarket_test
        ports: ['5544:5432']
        options: >-
          --health-cmd "pg_isready -U agri"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://agri:agri@127.0.0.1:5544/agrimarket_test
      JWT_SECRET: ci-only-secret-0123456789abcdefghij
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm build
      # Tests migrate + seed the isolated `*_test` database only (see vitest.config.ts).
      - run: pnpm --filter @agrimarket/api exec vitest run
      - name: Secret scan
        run: |
          if git grep -nE '(BEGIN [A-Z ]*PRIVATE KEY|AKIA[0-9A-Z]{16}|sk_live_[0-9a-zA-Z]{24})' -- ':!pnpm-lock.yaml'; then
            echo '::error::possible secret committed'
            exit 1
          fi
