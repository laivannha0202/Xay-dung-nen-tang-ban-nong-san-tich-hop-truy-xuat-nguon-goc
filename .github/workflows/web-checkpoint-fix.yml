name: Web checkpoint fix

on:
  push:
    branches:
      - ai/finish-commerce-v8b

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/finish-commerce-v8b
          fetch-depth: 0

      - name: Apply targeted checkpoint fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'apps/customer-web/src/app/tai-khoan/page.tsx': [
                  ('<AgriContainer py={{ base: 28, md: 42 }}>', '<AgriContainer py="xl">'),
              ],
              'apps/customer-web/src/components/gio-hang-content.tsx': [
                  ('<Paper key={supplier.id} withBorder className="agri-surface" p={{ base: \'md\', md: \'xl\' }}>', '<Paper key={supplier.id} withBorder className="agri-surface" p="xl">'),
              ],
              'apps/customer-web/src/components/trang-chu-content.tsx': [
                  ('  IconBuildingStore,\n', ''),
                  ('          <Grid align="stretch" gutter={{ base: \'md\', md: \'xl\' }}>', '          <Grid align="stretch">'),
              ],
              'apps/customer-web/src/components/chi-tiet-san-pham-content.tsx': [
                  ('  Divider,\n', ''),
              ],
              'apps/customer-web/src/components/danh-sach-don-hang-content.tsx': [
                  ('  Title,\n', ''),
              ],
              'apps/customer-web/src/components/ho-so-khach-hang-content.tsx': [
                  (', Title', ''),
                  ('Title, ', ''),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              original = text
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new)
              if text == original:
                  print(f'No change: {filename}')
              else:
                  path.write_text(text)
                  print(f'Updated: {filename}')
          PY

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify customer web checkpoint
        run: |
          pnpm --filter @agrimarket/customer-web typecheck
          pnpm --filter @agrimarket/customer-web build
          pnpm lint
          git diff --check

      - name: Commit verified fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/web-checkpoint-fix.yml
          git add apps/customer-web
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(web): clear customer web checkpoint blockers"
          git push origin HEAD:ai/finish-commerce-v8b
